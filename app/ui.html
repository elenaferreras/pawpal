<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent lets the web content extend behind the iOS status bar
         so the .ios-status-blur overlay can frost the content passing under it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PawPal" />
    <meta name="theme-color" content="transparent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>PawPal</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Frosted-glass status-bar overlay for iOS home-screen (standalone) mode.
         Purely decorative; styling + display-mode gating live in global.css. -->
    <div class="ios-status-blur" aria-hidden="true"></div>
    <!-- Portrait-only lock: shown over the app when a touch device is rotated
         to landscape (styling + orientation gating live in global.css). -->
    <div class="orientation-lock" role="alertdialog" aria-label="Rotate your device">
      <div class="orientation-lock-inner">
        <div class="orientation-lock-icon" aria-hidden="true">📱</div>
        <p class="orientation-lock-title">Please rotate your device</p>
        <p class="orientation-lock-text">PawPal is designed for portrait mode.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
